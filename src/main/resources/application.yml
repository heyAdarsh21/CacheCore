spring:
  application:
    name: cachecore
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  max-http-request-header-size: 16KB

cachecore:
  # Positive maximum number of entries. When full, the least recently used entry is evicted.
  max-entries: ${CACHECORE_MAX_ENTRIES:10000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.cachecore: INFO
